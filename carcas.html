<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preload" href="fonts/montserrat-v31-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/inter-v20-cyrillic_latin-600.woff2" as="font" type="font/woff2" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Funds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="homepage">
        <div class="header" style="background-color: #2d3a30;">

            <div class="header-header-desctop">

                <div class="header-header">
                    
                    <section class="header-header-left">
                        <button class="options-games" id="open-menu-btn">
                            <img src="icons-svg/menu-cutted-icon.svg" width="702" height="600" alt="menu">
                        </button>
                        <!--ссылка держится на костылях. НЕ ТРОГАТЬ -->
                        <a title="More about us" class="company-name-link" href="">
                            <span class="final-bear-in-circle-logo"><img src="icons-svg/final-bear-in-circle-logo.svg" width="90" height="90" alt="logo"></span>
                            <span class="company-name">RB FUNDS</span>
                        </a>
                    </section>

<!--
                    <section class="header-header-middle">
                        <a title="More about us" class="company-name-link" href="">
                            <span class="final-bear-in-circle-logo"><img src="icons-svg/final-bear-in-circle-logo.svg" width="90" height="90" alt="menu" loading="lazy"></span>
                            <span class="company-name">RB FUNDS</span>
                        </a>
                    </section>
-->
                    
                    <section class="header-header-right">
                        <div class="language"></div>
                        <button class="profile-button" id="profile-button">
                            <img src="icons-svg/penguin-profile-icon.svg">
                        </button>
                    </section>

                </div>
            </div>

            <div class="header-header-mobile">
                <!--Для мобильных телефонов-->
            </div>

        </div>


        <div class="middle">

            <div class="middle-l-p">
                <div class="tab-links-to-articles&funds">
                <!--выдвижная вкладка со ссылками на статьи про проблемы животных и
                про фонды, которые с ними борются-->
                </div>

            </div>

            <div class="middle-m-p">
                <div class="cards-games">
                    <div class="carusel">
                        <img src="images/bear.jpeg" alt="bear">
                        <img src="images/bars.jpeg" alt="bars">
                        <img src="images/penguin.jpg" alt="penguin">
                    </div>
                </div>
            </div>

            <div class="middle-l-p">
                <div class="linkButton-donation-to-funds">
                <!--ссылка для перехода на страницу с конкретными фондами и донатом в них-->
                </div>
            </div>

        </div>
        

        <div class="lower" style="background-color: #2f2f2f;">
            <!--информация про нас-->
        </div>

    </div>

    <!--затемнение-->
    <div class="overlay-menu" id="overlay-menu"></div>

    <!--выдвигающееся меню -->
    <div class="pull-out-menu" id="pull-out-menu">

        <div class="side-panel-header">
            <button class="options-games" id="close-menu-btn" style="margin-right: 5px;">
                <img src="icons-svg/menu-cutted-icon.svg" width="702" height="600" alt="menu">
            </button>
            
            <a title="More about us" class="company-name-link" href="">
                <span class="final-bear-in-circle-logo"><img src="icons-svg/final-bear-in-circle-logo.svg" width="90" height="90" alt="menu"></span>
                <span class="company-name">RB FUNDS</span>
            </a>

        </div>
        <nav class="nav-pull-out-menu">
            <a href="#">О нас</a>
            <a href="#">О вас</a>
            <a href="#">О внас</a>
            <a href="#">Ананас</a>
        </nav>
    </div>
    
    <!-- меню регистрации/авторизации -->
    <div class="log-in-menu" id="log-in-menu">
        <div class="log-in-panel">
            <button class="log-in-close" id="log-in-close">X</button>
            <b class="log-in-panel-text">ВХОД</b>
            <form class="log-in-form" id="auth-form">
                <input type="text" class="user-log-in-login" id="user-log-in-login" placeholder="Введите логин / e-mail / номер телефона" required>
                <input type="password" class="user-log-in-password" id="user-log-in-password" placeholder="Введите пароль" required>
                <button type="submit" class="log-in-button" id="log-in-button">Войти</button>
            </form>
        </div>
    </div>
    
    <script src="logic.js"></script>
</body>
</html>
