<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preload" href="fonts/montserrat-v31-latin-700.woff2" as="font" type="font/woff2" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Funds</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="homepage">

    <div class="header" style="background-color: #2d3a30;">

        <div class="header-header-desctop">

            <div class="header-header">

                <section class="header-header-left">
                    <button class="options-games" id="open-menu-btn">
                        <img src="icons-svg/menu-cutted-icon.svg" alt="menu" loading="lazy">
                    </button>

                    <!-- ссылка держится на костылях. НЕ ТРОГАТЬ -->
                    <a class="company-name-link" href="" title="More about us">
                        <span class="final-bear-in-circle-logo">
                            <img src="icons-svg/final-bear-in-circle-logo.svg" alt="logo" loading="lazy">
                        </span>
                        <span class="company-name">RB FUNDS</span>
                    </a>
                </section>

                <!--
                <section class="header-header-middle">
                    ...
                </section>
                -->

                <section class="header-header-right">
                    <div class="language"></div>
                    <div class="profile"></div>
                </section>

            </div>
        </div>

        <div class="header-header-mobile">
            <!-- потом будет мобилка -->
        </div>

    </div>


    <div class="middle">

        <div class="middle-l-p">
            <div class="tab-links-to-articles&funds">
                <!-- вкладка со статьями/фондами -->
            </div>
        </div>

        <div class="middle-m-p">
            <div class="cards-games">
                <div class="carusel">
                    <img src="images/bear.jpeg" alt="bear">
                    <img src="images/bars.jpeg" alt="bars">
                    <img src="images/penguin.jpg" alt="penguin">
                </div>
            </div>
        </div>

        <div class="middle-l-p">
            <div class="linkButton-donation-to-funds">
                <!-- сюда кнопка доната -->
            </div>
        </div>

    </div>


    <div class="lower" style="background-color: #2f2f2f;">
        <!-- инфа про нас -->
    </div>

</div>


<!-- затемнение -->
<div class="overlay-menu" id="overlay-menu"></div>

<!-- меню -->
<div class="pull-out-menu" id="pull-out-menu">

    <div class="side-panel-header">
        <button class="options-games" id="close-menu-btn" style="margin-right: 5px;">
            <img src="icons-svg/menu-cutted-icon.svg" alt="menu">
        </button>

        <a class="company-name-link" href="" title="More about us">
            <span class="final-bear-in-circle-logo">
                <img src="icons-svg/final-bear-in-circle-logo.svg" alt="logo">
            </span>
            <span class="company-name">RB FUNDS</span>
        </a>
    </div>

    <nav class="nav-pull-out-menu">
        <a href="#">Govno</a>
        <a href="#">Kapusta</a>
        <a href="#">Каk kakat</a>
        <a href="#">I luv u</a>
    </nav>

</div>

<script src="logic.js"></script>

</body>
</html>
